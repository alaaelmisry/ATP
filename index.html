<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ATP DAILY START OF WORK</title>

<link rel="stylesheet" href="style.css">

<script src="data.js"></script>
<script src="script.js" defer></script>

</head>


<body>


<div class="container">


<!-- اسم الشركة -->

<h2 id="companyName"></h2>


<!-- اسم المشروع -->

<h1 id="projectName"></h1>


<!-- التاريخ -->

<div id="todayDate" class="date-box"></div>



<!-- اختيار نوع المركبة -->

<div class="card">

<label>

يرجى اختيار نوع المركبة

</label>

<select id="vehicleType">

<option value="">

اختر نوع المركبة

</option>

</select>

</div>



<!-- اختيار رقم المركبة -->

<div class="card hidden" id="vehicleNumberCard">

<label>

يرجى اختيار رقم المركبة

</label>

<select id="vehicleNumber">

<option value="">

اختر رقم المركبة

</option>

</select>

</div>



<!-- رسالة الترحيب -->

<div class="card hidden" id="welcomeCard">

<h3 id="welcomeMessage"></h3>

</div>



<!-- تأكيد اسم السائق -->

<div class="card hidden" id="driverConfirmCard">

<p>

هل أنت السائق أو المشغل المسجل لهذه المركبة ؟

</p>

<div class="button-group">

<button id="yesDriver">

نعم

</button>


<button id="noDriver">

لست أنا

</button>

</div>

</div>



<!-- إدخال اسم السائق البديل -->

<div class="card hidden" id="newDriverCard">

<label>

يرجى كتابة اسم السائق أو المشغل لهذا اليوم

</label>

<input
type="text"
id="newDriverName"
placeholder="اكتب الاسم هنا">

</div>



<!-- تأكيد حالة العمل -->

<div class="card hidden" id="workStatusCard">

<p>

يرجى تأكيد حالة العمل لهذا اليوم

</p>


<label>

<input
type="radio"
name="workStatus"
value="بدأت العمل">

بدأت العمل

</label>


<label>

<input
type="radio"
name="workStatus"
value="لم أبدأ العمل">

لم أبدأ العمل بسبب

</label>

</div>



<!-- أسباب عدم بدء العمل -->

<div class="card hidden" id="reasonCard">

<p>

اختر سبب عدم بدء العمل

</p>


<label>

<input
type="radio"
name="reason"
value="أنا متغيب اليوم">

أنا متغيب اليوم

</label>


<label>

<input
type="radio"
name="reason"
value="أنا في إجازة مرضية">

أنا في إجازة مرضية

</label>


<label>

<input
type="radio"
name="reason"
value="أنا في إجازة سنوية">

أنا في إجازة سنوية

</label>


<label>

<input
type="radio"
name="reason"
value="يوجد عطل بالمركبة">

يوجد عطل بالمركبة

</label>

</div>



<!-- وصف العطل -->

<div class="card hidden" id="faultCard">

<label>

يرجى كتابة وصف مختصر للعطل

</label>


<textarea
id="faultDescription"
rows="4"
placeholder="اكتب وصف العطل هنا">

</textarea>

</div>



<!-- زر الإرسال -->

<div class="card hidden" id="sendCard">

<button id="sendButton">

إرسال البلاغ

</button>

</div>



</div>


</body>

</html>
